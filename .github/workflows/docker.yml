name: Build and Push Docker Image to ACR

# A v* tag builds the image and pushes it to Aliyun ACR, where SingTown AI
# pulls it from. Run it by hand (workflow_dispatch) to check that a branch
# still builds: that builds the image and pushes nothing.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  ACR_REGISTRY: registry.cn-shenzhen.aliyuncs.com
  ACR_IMAGE: registry.cn-shenzhen.aliyuncs.com/singtown-ai/singtown-ai-trainer-yolov5rk

jobs:
  build:
    # The image carries the CUDA libraries and is too big for a GitHub-hosted
    # runner's disk, and the office network pushes to ACR much faster.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Image tags
        id: tags
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            # v1.2.3 is published as 1.2.3 and as 1.2
            echo "tags=$ACR_IMAGE:$version $ACR_IMAGE:${version%.*}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$ACR_IMAGE:ci-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Runner disk and Docker
        run: |
          df -h / "$(docker info --format '{{.DockerRootDir}}')"
          docker version --format 'docker {{.Server.Version}}'
          docker buildx version || true

      # --pull --no-cache: the runner keeps its layer cache between runs, and a
      # cached layer would silently reuse an old base image or an old
      # clone of yolov5_rk.
      #
      # ACR rejects the provenance attestation manifest that buildx attaches by
      # default ("unknown manifest class for application/vnd.oci.empty.v1+json").
      - name: Build
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: 1
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          tag_args=()
          for tag in $TAGS; do
            tag_args+=(-t "$tag")
          done
          docker build --pull --no-cache --platform linux/amd64 "${tag_args[@]}" .

      - name: Log in to ACR
        if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Push to ACR
        if: github.ref_type == 'tag'
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker push "$tag"
          done

      # The image is several GB; do not let every release pile up on the runner.
      - name: Remove the image from the runner
        if: always()
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker image rm "$tag" || true
          done
