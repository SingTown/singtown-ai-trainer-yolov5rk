name: Build and Push Docker Image to ACR

# Pushing a v* tag builds the image and pushes it to Aliyun ACR, where SingTown
# AI pulls it from. Run it by hand (workflow_dispatch) to check that a branch
# still builds: that builds the image and pushes nothing.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  ACR_REGISTRY: registry.cn-shenzhen.aliyuncs.com
  ACR_IMAGE: registry.cn-shenzhen.aliyuncs.com/singtown-ai/singtown-ai-trainer-yolov5rk
  BUILDER: trainer-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build:
    # The image carries the CUDA libraries and is too big for a GitHub-hosted
    # runner's disk, and the office network pushes to ACR much faster.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 120

    steps:
      # persist-credentials: false keeps the job's GitHub token out of
      # .git/config, so a Dockerfile that copies the checkout cannot put it in
      # an image layer.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Only a pushed v* tag publishes. A manual run never does, even when it is
      # started on a tag, so it cannot replace a released image.
      - name: Image tags
        id: tags
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            # v1.2.3+build.5 is release 1.2.3: SemVer build metadata is not part
            # of the version, and "+" is not allowed in an image tag.
            version="${version%%+*}"
            tags="$ACR_IMAGE:$version"
            # v1.2.3 is also published as 1.2; a prerelease (v1.2.3-rc.1) is not
            if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              tags="$tags $ACR_IMAGE:${version%.*}"
            fi
            publish=true
          else
            tags="$ACR_IMAGE:ci-$GITHUB_SHA"
            publish=false
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Runner disk and Docker
        run: |
          df -h / "$(docker info --format '{{.DockerRootDir}}')"
          docker version --format 'docker {{.Server.Version}}'
          docker buildx version

      # A throwaway builder: one build leaves about 12 GB of cache, which is
      # deleted with the builder at the end of the job instead of piling up on
      # the shared runner. Starting empty also means the base image and the
      # yolov5_rk clone
      # can never come from a stale cached layer.
      - name: Create the builder
        run: docker buildx create --name "$BUILDER" --driver docker-container

      - name: Log in to ACR
        if: steps.tags.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # --provenance=false: ACR rejects the attestation manifest that buildx
      # attaches by default ("unknown manifest class for
      # application/vnd.oci.empty.v1+json").
      - name: Build and push
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          PUBLISH: ${{ steps.tags.outputs.publish }}
        run: |
          tag_args=()
          for tag in $TAGS; do
            tag_args+=(-t "$tag")
          done
          if [ "$PUBLISH" = true ]; then
            output=(--push)
          else
            output=(--output type=cacheonly)
          fi
          docker buildx build --builder "$BUILDER" --provenance=false \
            --platform linux/amd64 "${tag_args[@]}" "${output[@]}" .

      - name: Remove the builder
        if: always()
        run: docker buildx rm --force "$BUILDER" || true
